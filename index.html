  *,*::before,*::after{ box-sizing:border-box; }

  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  body{
    margin:0;
    min-height:100dvh;
    background:var(--ground);
    color:var(--fg);
    font-family:"Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
    padding-left:env(safe-area-inset-left, 0px);
    padding-right:env(safe-area-inset-right, 0px);
  }
  img{ max-width:100%; display:block; }
  button{ font:inherit; color:inherit; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  a{ color:inherit; -webkit-touch-callout:none; }
  [hidden]{ display:none !important; }

  :focus-visible{ outline:2px solid var(--brass); outline-offset:2px; border-radius:4px; }

  .chrome{ user-select:none; -webkit-user-select:none; }

  .wrap{
    width:100%;
    max-width:452px;
    margin:0 auto;
    padding-inline:16px;
    padding-block:34px 28px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---- card ---- */
  .plate{
    background:var(--plate);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .ident{
    display:flex;
    flex-direction:column;
    gap:16px;
    align-items:center;
    justify-content:center;
    padding:20px 20px 18px;
  }
  .avatar, .monogram{
    width:86px; height:86px;
    border-radius:4px;
    border:1px solid var(--line);
    background:var(--brass-wash);
    flex:0 0 auto;
  }
  .avatar{ object-fit:cover; }
  .monogram{
    display:grid; place-items:center;
    color:var(--brass-ink);
    font-family:"Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight:800;
    font-size:30px;
  }
  .ident-text{
    width:100%;
    padding-top:2px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    text-align:center;
  }
  .name{
    font-family:"Bricolage Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
    font-weight:700;
    font-size:clamp(25px, 7.4vw, 31px);
    line-height:1.06;
    letter-spacing:-.022em;
    margin:0;
    text-wrap:balance;
    word-break:break-word;
  }
  .tagline{ margin:0; color:var(--fg-2); font-size:13.5px; line-height:1.4; }

  /* ---- rows ---- */
  .rows{ border-top:1px solid var(--line); }
  .row{
    display:flex;
    align-items:center;
    gap:13px;
    min-height:60px;
    padding:13px 20px;
    border-bottom:1px solid var(--line-soft);
    text-decoration:none;
    position:relative;
    background:transparent;
    transition:background .16s ease;
  }
  .rows > :last-child{ border-bottom:0; }
  .row::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:2px;
    background:var(--brass);
    transform:scaleY(0);
    transition:transform .18s ease;
  }
  /* press feedback on touch, hover only where a real pointer exists */
  .row:active{ background:var(--plate-2); }
  .row:active::before{ transform:scaleY(1); }
  @media (hover:hover) and (pointer:fine){
    .row:hover{ background:var(--plate-2); }
    .row:hover::before{ transform:scaleY(1); }
    .row:hover .go{ transform:translate(2px,-2px); opacity:1; }
  }

  .tile{
    flex:0 0 auto;
    width:34px; height:34px;
    border-radius:4px;
    display:grid; place-items:center;
    color:var(--mark);
    background:var(--wash);
  }
  .tile svg{ width:17px; height:17px; display:block; fill:currentColor; }

  .row-text{ min-width:0; flex:1 1 auto; display:flex; flex-direction:column; }
  .row-name{ display:block; font-weight:600; font-size:14.5px; letter-spacing:-.006em; }
  .row-sub{
    display:block;
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11.5px;
    color:var(--fg-3);
    margin-top:1px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .go{ flex:0 0 auto; width:15px; height:15px; color:var(--fg-3); opacity:.65; transition:transform .18s ease, opacity .18s ease; }
  .go svg{ width:15px; height:15px; display:block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .row.is-empty{ opacity:.52; }

  /* ---- actions ---- */
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn{
    flex:1 1 auto;
    min-width:112px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    padding:10px 14px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--plate);
    cursor:pointer;
    font-size:13px;
    font-weight:500;
    letter-spacing:-.004em;
    touch-action:manipulation;
    transition:border-color .16s ease, background .16s ease, color .16s ease, transform .1s ease;
  }
  .btn:active{ transform:scale(.97); }
  @media (hover:hover) and (pointer:fine){
    .btn:hover{ border-color:var(--brass); color:var(--brass-ink); }
  }
  .btn svg{ width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .btn-primary{ background:var(--brass-wash); border-color:var(--brass); color:var(--brass-ink); }
  .btn-icon{ flex:0 0 auto; min-width:0; width:44px; padding:10px 0; }
  .btn-icon svg{ width:16px; height:16px; }

  /* ---- sheet ---- */
  .sheet{
    position:fixed; inset:0;
    z-index:40;
    background:color-mix(in srgb, var(--ground) 86%, transparent);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:16px;
    padding-top:calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom:calc(28px + env(safe-area-inset-bottom, 0px));
    animation:fade .18s ease;
  }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .sheet-inner{
    width:100%;
    max-width:452px;
    background:var(--plate);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:var(--shadow);
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .sheet-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .sheet-title{ font-family:"Bricolage Grotesque", sans-serif; font-weight:700; font-size:19px; letter-spacing:-.018em; margin:0; }
  .x{
    border:1px solid var(--line); background:var(--plate-2);
    border-radius:4px; width:32px; height:32px; display:grid; place-items:center;
    cursor:pointer; flex:0 0 auto; touch-action:manipulation;
  }
  .x svg{ width:13px; height:13px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; }

  .qr-plate{ background:#FFFFFF; border:1px solid var(--line); border-radius:5px; padding:14px; display:grid; place-items:center; }
  .qr-plate canvas{ display:block; width:100%; max-width:236px; height:auto; }
  .qr-url{
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:11px; line-height:1.5; color:var(--fg-2);
    word-break:break-all;
    background:var(--plate-2);
    border:1px solid var(--line-soft);
    border-radius:4px;
    padding:9px 10px;
  }
  .hint{ font-size:12px; color:var(--fg-3); line-height:1.45; margin:0; }
  .status{ font-family:"IBM Plex Mono", monospace; font-size:11px; color:var(--brass-ink); min-height:16px; }
  .status[data-tone="bad"]{ color:#D6503C; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>

    youtube:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.5 3.54 12 3.54 12 3.54s-7.5 0-9.38.51A3.02 3.02 0 0 0 .5 6.19C0 8.07 0 12 0 12s0 3.93.5 5.81a3.02 3.02 0 0 0 2.12 2.14c1.88.51 9.38.51 9.38.51s7.5 0 9.38-.51a3.02 3.02 0 0 0 2.12-2.14C24 15.93 24 12 24 12s0-3.93-.5-5.81zM9.55 15.57V8.43L15.82 12l-6.27 3.57z"/></svg>',
    behance:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M0 4.8v14.4h7.43c2.65 0 5.1-1.26 5.1-4.2 0-1.83-.88-3.16-2.64-3.64 1.27-.6 1.95-1.72 1.95-3.15 0-2.78-2.15-3.41-4.6-3.41H0zm3.23 2.5h3.13c1.17 0 2.25.29 2.25 1.73 0 1.24-.88 1.73-2.05 1.73H3.23V7.3zm0 5.66h3.53c1.47 0 2.35.58 2.35 2.1 0 1.45-1.08 1.93-2.35 1.93H3.23v-4.03zM15.1 6.62h5.87v1.45H15.1V6.62zm2.9 3.08c-3.14 0-5.28 2.34-5.28 5.4 0 3.13 2.05 5.4 5.28 5.4 2.45 0 4.03-1.1 4.8-3.45h-2.55c-.3.88-1.37 1.35-2.15 1.35-1.57 0-2.45-.97-2.45-2.54h7.35c.2-3.25-1.57-6.16-5-6.16zm-2.35 4.22c.05-1.28.98-2.13 2.3-2.13 1.37 0 2.05.78 2.15 2.13h-4.45z"/></svg>',
    dribbble:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.39 0 0 5.39 0 12s5.39 12 12 12 12-5.39 12-12S18.61 0 12 0zm7.94 5.54c1.43 1.74 2.29 3.96 2.31 6.38-.34-.07-3.73-.76-7.14-.33-.07-.17-.14-.35-.22-.53-.21-.5-.44-1-.68-1.49 3.79-1.55 5.51-3.75 5.73-4.03zM12 1.8c2.6 0 4.98.98 6.79 2.59-.18.26-1.73 2.34-5.37 3.7-1.68-3.09-3.54-5.62-3.82-6a10.2 10.2 0 0 1 2.4-.29zM7.61 2.8c.27.37 2.1 2.91 3.8 5.93-4.8 1.27-9.02 1.25-9.48 1.25a10.26 10.26 0 0 1 5.68-7.18zM1.8 12.01v-.31c.45.01 5.41.07 10.54-1.47.29.57.57 1.15.83 1.74l-.4.12C7.48 13.8 4.67 18.46 4.44 18.86A10.16 10.16 0 0 1 1.8 12.01zM12 22.2c-2.37 0-4.56-.81-6.29-2.17.18-.37 2.25-4.38 8.04-6.4l.07-.02c1.44 3.74 2.04 6.87 2.19 7.77A10.15 10.15 0 0 1 12 22.2zm5.73-1.69c-.11-.62-.65-3.62-1.99-7.31 3.21-.51 6.03.32 6.38.43a10.23 10.23 0 0 1-4.39 6.88z"/></svg>',
    github:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.83-.26.83-.58l-.02-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.08-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.36.81 1.1.81 2.22l-.01 3.29c0 .32.21.69.82.57A12 12 0 0 0 12 .3z"/></svg>',
    whatsapp:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.46-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.21 3.07.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.42-.08-.12-.28-.2-.57-.35M12.05 21.79h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.89 9.89-9.89 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.43 9.89-9.88 9.89M20.46 3.49A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45h.01c6.55 0 11.89-5.34 11.89-11.89a11.82 11.82 0 0 0-3.48-8.42"/></svg>',
    email:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 4h19A1.5 1.5 0 0 1 23 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-19A1.5 1.5 0 0 1 1 18.5v-13A1.5 1.5 0 0 1 2.5 4zm.86 2L12 12.06 20.64 6H3.36zM21 7.66l-8.43 5.9a1 1 0 0 1-1.14 0L3 7.66V18h18V7.66z"/></svg>',
    website:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1a11 11 0 1 0 0 22 11 11 0 0 0 0-22zm7.42 6.5h-3.2a16.7 16.7 0 0 0-1.77-4.02A9.04 9.04 0 0 1 19.42 7.5zM12 3.12c.8 1.1 1.5 2.5 1.98 4.38h-3.96C10.5 5.62 11.2 4.22 12 3.12zM3.26 14a8.96 8.96 0 0 1 0-4h3.6a18.6 18.6 0 0 0 0 4h-3.6zm.76 2.5h3.2c.4 1.45.98 2.82 1.77 4.02A9.04 9.04 0 0 1 4.02 16.5zm3.2-9h-3.2a9.04 9.04 0 0 1 4.97-4.02A16.7 16.7 0 0 0 7.22 7.5zM12 20.88c-.8-1.1-1.5-2.5-1.98-4.38h3.96c-.48 1.88-1.18 3.28-1.98 4.38zM14.42 14H9.58a16.4 16.4 0 0 1 0-4h4.84a16.4 16.4 0 0 1 0 4zm.43 6.52c.79-1.2 1.37-2.57 1.77-4.02h3.2a9.04 9.04 0 0 1-4.97 4.02zM17.14 14a18.6 18.6 0 0 0 0-4h3.6a8.96 8.96 0 0 1 0 4h-3.6z"/></svg>'
  };

  var NAMES = {
    linkedin:"LinkedIn", instagram:"Instagram", facebook:"Facebook", x:"X", threads:"Threads",
    tiktok:"TikTok", youtube:"YouTube", behance:"Behance", dribbble:"Dribbble", github:"GitHub",
    whatsapp:"WhatsApp", email:"Email", website:"Website"
  };

  var app = document.getElementById("app");
  var THEME_KEY = "rs-links-theme";

  var SUN = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function href(k, raw){
    var v = String(raw || "").trim();
    if(!v) return "";
    if(k === "email") return /^mailto:/i.test(v) ? v : "mailto:" + v.replace(/^mailto:/i,"");
    if(/^https?:\/\//i.test(v)) return v;
    if(/^[\w.+-]+@[\w.-]+\.\w+$/.test(v)) return "mailto:" + v;
    return "https://" + v.replace(/^\/+/,"");
  }

  function initials(nm){
    var parts = String(nm || "").trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return "--";
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
  }

  function slug(nm){
    return String(nm || "links").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "links";
  }

  function shareUrl(){ return String(window.location.href).split("#")[0]; }

  /* ---------- theme ---------- */

  function systemDark(){
    try{ return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches); }
    catch(e){ return false; }
  }
  function currentTheme(){
    var a = document.documentElement.getAttribute("data-theme");
    if(a === "dark" || a === "light") return a;
    return systemDark() ? "dark" : "light";
  }
  function syncStatusBar(){
    var bg = getComputedStyle(document.body).backgroundColor;
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for(var i = 0; i < metas.length; i++) metas[i].setAttribute("content", bg);
  }
  function applyTheme(mode){
    document.documentElement.setAttribute("data-theme", mode);
    try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
    syncStatusBar();
  }
  function restoreTheme(){
    try{
      var s = localStorage.getItem(THEME_KEY);
      if(s === "dark" || s === "light") document.documentElement.setAttribute("data-theme", s);
    }catch(e){}
  }

  /* ---------- render ---------- */

  function render(){
    var isDark = currentTheme() === "dark";
    var next = isDark ? "light" : "dark";

    var rows = (PROFILE.links || []).map(function(l){
      var k = l.platform;
      if(!ICON[k]) return "";
      var to = href(k, l.url);
      var inner =
        '<span class="tile" style="--mark:var(--m-' + k + ');--wash:var(--w-' + k + ')">' + ICON[k] + '</span>' +
        '<span class="row-text">' +
          '<span class="row-name">' + esc(NAMES[k]) + '</span>' +
          (to ? '' : '<span class="row-sub">Not set yet</span>') +
        '</span>' +
        '<span class="go"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></span>';
      if(!to) return '<div class="row is-empty">' + inner + '</div>';
      return '<a class="row" href="' + esc(to) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>';
    }).join("");

    var face = PROFILE.photo
      ? '<img class="avatar" src="' + esc(PROFILE.photo) + '" alt="' + esc(PROFILE.name) + '" width="86" height="86">'
      : '<div class="monogram" aria-hidden="true">' + esc(initials(PROFILE.name)) + '</div>';

    app.innerHTML =
      '<section class="plate">' +
        '<div class="ident">' + face +
          '<div class="ident-text">' +
            '<h1 class="name">' + esc(PROFILE.name) + '</h1>' +
            (PROFILE.tagline ? '<p class="tagline">' + esc(PROFILE.tagline) + '</p>' : '') +
          '</div>' +
        '</div>' +
        '<div class="rows">' + rows + '</div>' +
      '</section>' +
      '<div class="actions chrome">' +
        '<button class="btn btn-primary" id="btn-qr" type="button">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/></svg>' +
          'QR code</button>' +
        '<button class="btn" id="btn-share" type="button">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>' +
          '<span id="share-label">Share</span></button>' +
        '<button class="btn btn-icon" id="btn-theme" type="button" aria-label="' + next + ' mode" title="Switch to ' + next + ' mode">' +
          (isDark ? SUN : MOON) + '</button>' +
      '</div>';

    document.getElementById("btn-qr").addEventListener("click", openQR);
    document.getElementById("btn-share").addEventListener("click", share);
    document.getElementById("btn-theme").addEventListener("click", function(){
      applyTheme(currentTheme() === "dark" ? "light" : "dark");
      render();
    });
  }

  /* ---------- share ---------- */

  function share(){
    var url = shareUrl();
    var lbl = document.getElementById("share-label");
    var flash = function(msg){
      if(!lbl) return;
      var was = lbl.textContent;
      lbl.textContent = msg;
      setTimeout(function(){ lbl.textContent = was; }, 1600);
    };
    if(navigator.share){
      navigator.share({ title: PROFILE.name, text: PROFILE.tagline, url: url })
        .catch(function(){});
      return;
    }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ flash("Copied"); }, function(){ flash("Copy failed"); });
    } else {
      flash("Copy failed");
    }
  }

  /* ---------- QR ---------- */

  function sheet(title, bodyHTML){
    var el = document.createElement("div");
    el.className = "sheet chrome";
    el.innerHTML =
      '<div class="sheet-inner" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
        '<div class="sheet-head"><h2 class="sheet-title">' + esc(title) + '</h2>' +
        '<button class="x" type="button" aria-label="Close">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>' +
        bodyHTML +
      '</div>';
    var close = function(){
      if(el.parentNode) el.parentNode.removeChild(el);
      document.removeEventListener("keydown", onKey);
      document.body.style.overflow = "";
    };
    var onKey = function(e){ if(e.key === "Escape") close(); };
    el.querySelector(".x").addEventListener("click", close);
    el.addEventListener("click", function(e){ if(e.target === el) close(); });
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    document.body.appendChild(el);
    return { el: el, close: close };
  }

  function openQR(){
    var url = shareUrl();
    var s = sheet("Your QR code",
      '<div class="qr-plate"><canvas id="qr-canvas" width="720" height="720"></canvas></div>' +
      '<div class="qr-url">' + esc(url) + '</div>' +
      '<div class="actions"><button class="btn btn-primary" id="qr-save" type="button">' +
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>' +
        'Save PNG</button></div>' +
      '<p class="hint">Print it, add it to a business card, or set it as a lock screen. It points at this page, so it keeps working after you change your links.</p>' +
      '<p class="status" id="qr-status"></p>');

    var canvas = s.el.querySelector("#qr-canvas");
    var statusEl = s.el.querySelector("#qr-status");

    if(typeof QRious === "undefined"){
      statusEl.textContent = "QR library still loading — close and try again.";
      statusEl.dataset.tone = "bad";
    } else {
      new QRious({ element: canvas, value: url, size: 720, level: "M", padding: 32, background: "#ffffff", foreground: "#0D1016" });
    }

    s.el.querySelector("#qr-save").addEventListener("click", function(){
      canvas.toBlob(function(blob){
        if(!blob){ statusEl.textContent = "Could not build the image."; statusEl.dataset.tone = "bad"; return; }
        var file = slug(PROFILE.name) + "-qr.png";
        if(navigator.canShare && navigator.canShare({ files: [new File([blob], file, { type: "image/png" })] })){
          navigator.share({ files: [new File([blob], file, { type: "image/png" })], title: "QR code" }).catch(function(){});
          return;
        }
        var href = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = href; a.download = file;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function(){ URL.revokeObjectURL(href); }, 4000);
        statusEl.textContent = "Saved.";
      }, "image/png");
    });
  }

  /* ---------- boot ---------- */

  restoreTheme();
  render();
  syncStatusBar();

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
})();
</script>
